<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Puts the theme class on <html> before any stylesheet paints, so a dark reader never sees a light frame.
         ThemeProvider's layout effect runs only after React mounts, which is one bundle download too late.
         Stays first in <head>: an inline script after a stylesheet link waits for that link to load.
         Reads the same key and values as THEME_STORAGE_KEY in src/contexts/ThemeContext.tsx; the
         "reads the same storage key as ThemeContext" case in src/theme-first-paint.test.ts guards the pair. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme-preference');
        } catch (error) {
          // Safari in private mode throws here. Fall through to the system preference.
        }

        var dark = stored === 'dark';
        if (!dark && stored !== 'light') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (error) {
            dark = false;
          }
        }

        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <title>Meridiano</title>
    <!-- Stays byte-identical to og:description below so the two cannot drift; the "name=description repeats
         og:description" case in src/head-assets.test.ts guards the pair. -->
    <meta
      name="description"
      content="AI news briefings and article summaries from curated feeds, with bookmarks and YouTube transcriptions."
    />
    <meta name="author" content="Meridiano" />

    <!-- og:image is a relative path on purpose. Nothing on the internet reaches the Pi this deploys to
         (deploy/README.md), so there is no public origin to put in an absolute URL, and the tailnet hostname
         that does resolve stays out of this repo. Give Meridiano a public origin and this becomes
         %VITE_PUBLIC_ORIGIN%/icon-512.png via Vite's HTML env replacement, plus an og:url. -->
    <meta property="og:title" content="Meridiano: news briefings and article summaries" />
    <meta
      property="og:description"
      content="AI news briefings and article summaries from curated feeds, with bookmarks and YouTube transcriptions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:alt" content="The Meridiano mark, an orange circle crossed by meridian lines." />

    <!-- The 512x512 PNG is the icon fallback for a browser that does not render an SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Playfair starts at 600 since every font-serif heading is semibold or heavier (prose h1 is 800).
         Inter 700 and JetBrains Mono 600 are left out on purpose: font-bold Inter text falls back to the 600 face
         and prose inline code to the 500 face, and requesting them would change how that text looks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
